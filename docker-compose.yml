name: pwint-thit
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pwint_thit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env first}
      POSTGRES_DB: ${POSTGRES_DB:-pwint_thit}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
  migrate:
    image: pwint-thit-backend
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    command: ["./migrate", "./migrations"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-pwint_thit}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-pwint_thit}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
  backend:
    image: pwint-thit-backend
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      HTTP_ADDR: 0.0.0.0:8080
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://127.0.0.1:8088,http://localhost:8088}
      DATABASE_URL: postgres://${POSTGRES_USER:-pwint_thit}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-pwint_thit}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "127.0.0.1:${WEB_PORT:-8088}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped
volumes:
  postgres_data:
